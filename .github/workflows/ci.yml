name: Code prüfen

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Windows-Anmeldung bauen und prüfen
        run: npm run prepare:wam-helper

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Versionsnummern prüfen
        run: npm run version:check

      - name: Farbschemas prüfen
        run: npm run theme:check

      - name: Frontend bauen
        run: npm run build

      - name: Frontend-Komponententests
        run: npm test

      - name: Chromium für Ende-zu-Ende-Tests installieren
        run: npx playwright install chromium

      - name: Kritische Bedienabläufe testen
        run: npm run test:e2e

      - name: Rust formatieren prüfen
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust-Tests
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Outlook-Import einschließlich IMAP prüfen
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-email-outlook-adapter.ps1
